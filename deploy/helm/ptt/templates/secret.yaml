{{- $bootstrapToken := required "secrets.bootstrapToken is required" .Values.secrets.bootstrapToken -}}
{{- $relaySharedSecret := required "secrets.relaySharedSecret is required" .Values.secrets.relaySharedSecret -}}
{{- if lt (len $bootstrapToken) 32 -}}
{{- fail "secrets.bootstrapToken must contain at least 32 characters" -}}
{{- end -}}
{{- if lt (len $relaySharedSecret) 32 -}}
{{- fail "secrets.relaySharedSecret must contain at least 32 characters" -}}
{{- end -}}
{{- if and .Values.metrics.enabled (lt (len .Values.secrets.metricsToken) 32) -}}
{{- fail "secrets.metricsToken must contain at least 32 characters when metrics are enabled" -}}
{{- end -}}
{{- if .Values.calls.enabled -}}
{{- $livekitKey := required "secrets.livekitApiKey is required when calls are enabled" .Values.secrets.livekitApiKey -}}
{{- $livekitSecret := required "secrets.livekitApiSecret is required when calls are enabled" .Values.secrets.livekitApiSecret -}}
{{- if lt (len $livekitSecret) 32 -}}
{{- fail "secrets.livekitApiSecret must contain at least 32 characters when calls are enabled" -}}
{{- end -}}
{{- if ne $livekitKey .Values.livekit.livekit.webhook.api_key -}}
{{- fail "secrets.livekitApiKey must equal livekit.livekit.webhook.api_key" -}}
{{- end -}}
{{- if ne .Values.secrets.redisPassword .Values.livekit.livekit.redis.password -}}
{{- fail "livekit.livekit.redis.password must equal secrets.redisPassword" -}}
{{- end -}}
{{- if ne .Values.calls.turnDomain .Values.livekit.livekit.turn.domain -}}
{{- fail "calls.turnDomain must equal livekit.livekit.turn.domain" -}}
{{- end -}}
{{- if ne .Values.calls.turnTlsSecretName .Values.livekit.livekit.turn.secretName -}}
{{- fail "calls.turnTlsSecretName must equal livekit.livekit.turn.secretName" -}}
{{- end -}}
{{- end -}}
{{- if .Values.push.apns.enabled -}}
{{- $productionKeyId := required "push.apns.productionKeyId is required" .Values.push.apns.productionKeyId -}}
{{- $sandboxKeyId := required "push.apns.sandboxKeyId is required" .Values.push.apns.sandboxKeyId -}}
{{- $productionPrivateKey := required "secrets.apnsProductionPrivateKey is required when APNs is enabled" .Values.secrets.apnsProductionPrivateKey -}}
{{- $sandboxPrivateKey := required "secrets.apnsSandboxPrivateKey is required when APNs is enabled" .Values.secrets.apnsSandboxPrivateKey -}}
{{- if or (eq $productionKeyId $sandboxKeyId) (eq $productionPrivateKey $sandboxPrivateKey) -}}
{{- fail "production and sandbox APNs credentials must use independent keys" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ptt.fullname" . }}
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-password: {{ required "secrets.databasePassword is required" .Values.secrets.databasePassword | quote }}
  database-url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgres.username .Values.secrets.databasePassword (include "ptt.fullname" .) .Values.postgres.database | quote }}
  redis-password: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | quote }}
  redis-url: {{ printf "redis://:%s@%s-redis:6379" .Values.secrets.redisPassword (include "ptt.fullname" .) | quote }}
  object-store-password: {{ required "secrets.objectStorePassword is required" .Values.secrets.objectStorePassword | quote }}
  bootstrap-token: {{ $bootstrapToken | quote }}
  relay-shared-secret: {{ $relaySharedSecret | quote }}
  {{- if .Values.metrics.enabled }}
  metrics-token: {{ required "secrets.metricsToken is required when metrics are enabled" .Values.secrets.metricsToken | quote }}
  {{- end }}
  {{- if .Values.push.fcm.enabled }}
  fcm-service-account-json: {{ required "secrets.fcmServiceAccountJson is required when FCM is enabled" .Values.secrets.fcmServiceAccountJson | quote }}
  {{- end }}
  {{- if .Values.push.apns.enabled }}
  apns-production-private-key: {{ required "secrets.apnsProductionPrivateKey is required when APNs is enabled" .Values.secrets.apnsProductionPrivateKey | quote }}
  apns-sandbox-private-key: {{ required "secrets.apnsSandboxPrivateKey is required when APNs is enabled" .Values.secrets.apnsSandboxPrivateKey | quote }}
  {{- end }}
  {{- if .Values.smtp.enabled }}
  smtp-password: {{ required "secrets.smtpPassword is required when SMTP is enabled" .Values.secrets.smtpPassword | quote }}
  {{- end }}
{{- if .Values.calls.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ptt-call-credentials
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
type: Opaque
stringData:
  livekit-api-key: {{ .Values.secrets.livekitApiKey | quote }}
  livekit-api-secret: {{ .Values.secrets.livekitApiSecret | quote }}
  keys.yaml: |-
    {{ .Values.secrets.livekitApiKey }}: {{ .Values.secrets.livekitApiSecret }}
{{- end }}
