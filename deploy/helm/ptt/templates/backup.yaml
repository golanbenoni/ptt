{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ptt.fullname" . }}-backup
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.backup.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ptt.fullname" . }}-backup
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "ptt.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "ptt.serviceAccountName" . }}
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: postgres-backup
              image: {{ .Values.postgres.image | quote }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  export BACKUP_DIR="/backups/$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir -p "$BACKUP_DIR"
                  pg_dump --format=custom --file="$BACKUP_DIR/postgres.dump" "$DATABASE_URL"
                  printf '%s' "$BACKUP_DIR" > /backups/current
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ptt.fullname" . }}
                      key: database-url
              volumeMounts:
                - name: backup
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
            - name: object-backup
              image: {{ .Values.objectStore.clientImage | quote }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  BACKUP_DIR="$(cat /backups/current)"
                  mc alias set ptt "http://{{ include "ptt.fullname" . }}-object-store:9000" ptt "$MINIO_ROOT_PASSWORD"
                  mc mirror --overwrite "ptt/{{ .Values.objectStore.bucket }}" "$BACKUP_DIR/objects"
              env:
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ptt.fullname" . }}
                      key: object-store-password
              volumeMounts:
                - name: backup
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: finalize
              image: busybox:1.37
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  rm -f /backups/current
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +{{ .Values.backup.retentionDays }} -exec rm -rf {} +
              volumeMounts:
                - name: backup
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "ptt.fullname" . }}-backup
{{- end }}
