{{- if .Values.backup.enabled }}
{{- if not .Values.backup.encryptedStorageClassConfirmed }}
{{- fail "backup.encryptedStorageClassConfirmed must be true after verifying that the backup storage class encrypts data at rest" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ptt.fullname" . }}-backup
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.backup.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ptt.fullname" . }}-backup-volume-init-{{ sha256sum .Values.backup.finalizeImage | trunc 8 }}
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-volume-init
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ptt.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backup-volume-init
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ptt.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: {{ .Values.backup.finalizeImage | quote }}
          command: ["/bin/sh", "-ec", "test -d /backups"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: backup
              mountPath: /backups
          resources:
            {{- toYaml .Values.backup.resources | nindent 12 }}
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: {{ include "ptt.fullname" . }}-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ptt.fullname" . }}-backup
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "ptt.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "ptt.serviceAccountName" . }}
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: postgres-backup
              image: {{ .Values.postgres.image | quote }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  export BACKUP_DIR="/backups/$(date -u +%Y%m%dT%H%M%SZ)"
                  umask 0007
                  mkdir -p "$BACKUP_DIR"
                  chgrp 1000 "$BACKUP_DIR"
                  chmod 0770 "$BACKUP_DIR"
                  attempt=0
                  until pg_dump --format=custom --file="$BACKUP_DIR/postgres.dump" "$DATABASE_URL"; do
                    attempt=$((attempt + 1))
                    test "$attempt" -lt 60
                    rm -f "$BACKUP_DIR/postgres.dump"
                    sleep 2
                  done
                  printf '%s' "$BACKUP_DIR" > /backups/current
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ptt.fullname" . }}
                      key: database-url
                - name: PGCONNECT_TIMEOUT
                  value: "5"
              volumeMounts:
                - name: backup
                  mountPath: /backups
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
            - name: object-backup
              image: {{ .Values.objectStore.clientImage | quote }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  BACKUP_DIR="$(cat /backups/current)"
                  until mc alias set ptt "http://{{ include "ptt.fullname" . }}-object-store:9000" ptt "$MINIO_ROOT_PASSWORD"; do
                    sleep 2
                  done
                  mc mirror --overwrite "ptt/{{ .Values.objectStore.bucket }}" "$BACKUP_DIR/objects"
                  chmod -R g+rwX "$BACKUP_DIR/objects"
              env:
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ptt.fullname" . }}
                      key: object-store-password
              volumeMounts:
                - name: backup
                  mountPath: /backups
                - name: object-client-tmp
                  mountPath: /tmp
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          containers:
            - name: finalize
              image: {{ .Values.backup.finalizeImage | quote }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  rm -f /backups/current
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +{{ .Values.backup.retentionDays }} -exec rm -rf {} +
              volumeMounts:
                - name: backup
                  mountPath: /backups
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "ptt.fullname" . }}-backup
            - name: object-client-tmp
              emptyDir: {}
{{- end }}
