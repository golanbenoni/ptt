apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ptt.fullname" . }}-object-store-init
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ptt.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: object-store-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ptt.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: {{ .Values.objectStore.clientImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mc alias set ptt "http://{{ include "ptt.fullname" . }}-object-store:9000" ptt "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing "ptt/{{ .Values.objectStore.bucket }}"
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: object-store-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.objectStore.initResources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
