apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ptt.fullname" . }}-control
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  replicas: {{ .Values.control.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ptt.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ptt.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control
    spec:
      serviceAccountName: {{ include "ptt.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control
          image: {{ include "ptt.applicationImage" .Values.control.image | quote }}
          imagePullPolicy: {{ .Values.control.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: database-url
            - name: PTT_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: bootstrap-token
            - name: PTT_PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            - name: PTT_GRPC_BIND
              value: {{ printf "0.0.0.0:%v" .Values.control.grpcPort | quote }}
            - name: PTT_RELAY_PUBLIC_ADDRESS
              value: {{ .Values.relay.publicAddress | quote }}
            - name: PTT_RELAY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: relay-shared-secret
            - name: PTT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: redis-url
            {{- if .Values.metrics.enabled }}
            - name: PTT_METRICS_BIND
              value: {{ printf "0.0.0.0:%v" .Values.metrics.port | quote }}
            - name: PTT_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: metrics-token
            {{- end }}
            - name: PTT_OBJECT_STORE_ENDPOINT
              value: {{ printf "http://%s-object-store:9000" (include "ptt.fullname" .) | quote }}
            - name: PTT_OBJECT_STORE_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: PTT_OBJECT_STORE_ACCESS_KEY
              value: ptt
            - name: PTT_OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: object-store-password
            {{- if .Values.backup.enabled }}
            - name: PTT_BACKUP_SCHEDULE
              value: {{ .Values.backup.schedule | quote }}
            {{- end }}
            {{- if .Values.push.fcm.enabled }}
            - name: PTT_FCM_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: fcm-service-account-json
            {{- end }}
            {{- if .Values.push.apns.enabled }}
            - name: PTT_APNS_PRODUCTION_KEY_ID
              value: {{ required "push.apns.productionKeyId is required" .Values.push.apns.productionKeyId | quote }}
            - name: PTT_APNS_SANDBOX_KEY_ID
              value: {{ required "push.apns.sandboxKeyId is required" .Values.push.apns.sandboxKeyId | quote }}
            - name: PTT_APNS_TEAM_ID
              value: {{ required "push.apns.teamId is required" .Values.push.apns.teamId | quote }}
            - name: PTT_APNS_BUNDLE_ID
              value: {{ required "push.apns.bundleId is required" .Values.push.apns.bundleId | quote }}
            - name: PTT_APNS_PRODUCTION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: apns-production-private-key
            - name: PTT_APNS_SANDBOX_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: apns-sandbox-private-key
            {{- end }}
            {{- if .Values.smtp.enabled }}
            - name: PTT_SMTP_HOST
              value: {{ required "smtp.host is required" .Values.smtp.host | quote }}
            - name: PTT_SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: PTT_SMTP_USERNAME
              value: {{ required "smtp.username is required" .Values.smtp.username | quote }}
            - name: PTT_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ptt.fullname" . }}
                  key: smtp-password
            - name: PTT_SMTP_FROM
              value: {{ .Values.smtp.from | quote }}
            {{- end }}
            - name: RUST_LOG
              value: ptt_control=info,tower_http=info
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: {{ .Values.control.grpcPort }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ptt.fullname" . }}-control
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "ptt.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ptt.fullname" . }}-control-grpc
  labels:
    {{- include "ptt.labels" . | nindent 4 }}
  {{- with .Values.ingress.grpcAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "ptt.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control
  ports:
    - name: grpc
      port: {{ .Values.control.grpcPort }}
      targetPort: grpc
