nameOverride: ""
fullnameOverride: ""

publicBaseUrl: https://ptt.example.com

control:
  replicaCount: 1
  grpcPort: 50051
  image:
    repository: ghcr.io/golanbenoni/ptt-control
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
    pendingPushThreshold: 100
    failedPushThreshold: 0

adminWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/golanbenoni/ptt-admin-web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

relay:
  replicaCount: 1
  image:
    repository: ghcr.io/golanbenoni/ptt-relay
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 47000
  publicAddress: ptt.example.com:47000
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 2
      memory: 256Mi

ingress:
  enabled: true
  className: traefik
  host: ptt.example.com
  grpcHost: grpc.ptt.example.com
  tlsSecretName: ptt-tls
  annotations: {}
  grpcAnnotations:
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
  rateLimit:
    enabled: true
    average: 100
    burst: 200
    period: 1s

postgres:
  image: postgres:17-alpine
  database: ptt
  username: ptt
  storage: 10Gi
  storageClassName: local-path

redis:
  image: redis:7-alpine
  storage: 1Gi
  storageClassName: local-path

objectStore:
  image: minio/minio:RELEASE.2025-07-23T15-54-02Z
  bucket: ptt-history
  storage: 20Gi
  storageClassName: local-path
  clientImage: minio/mc:RELEASE.2025-07-21T05-28-08Z

smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  from: "PTT Talk <ptt@example.com>"

push:
  fcm:
    enabled: false
  apns:
    enabled: false
    keyId: ""
    teamId: ""
    bundleId: "app.ptt.talk"
    environment: production

backup:
  enabled: true
  schedule: "17 2 * * *"
  storage: 20Gi
  storageClassName: local-path
  retentionDays: 14

secrets:
  databasePassword: ""
  redisPassword: ""
  objectStorePassword: ""
  bootstrapToken: ""
  smtpPassword: ""
  relaySharedSecret: ""
  metricsToken: ""
  fcmServiceAccountJson: ""
  apnsPrivateKey: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: true
