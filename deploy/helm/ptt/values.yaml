nameOverride: ""
fullnameOverride: ""

publicBaseUrl: https://ptt.example.com

control:
  replicaCount: 1
  grpcPort: 50051
  image:
    repository: ghcr.io/golanbenoni/ptt-control
    tag: "0.1.27"
    # Set to an immutable sha256 digest in every production values file.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
    pendingPushThreshold: 100
    failedPushThreshold: 0
    recentCallMediaFailureThreshold: 0

adminWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/golanbenoni/ptt-admin-web
    tag: "0.1.27"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

relay:
  replicaCount: 1
  image:
    repository: ghcr.io/golanbenoni/ptt-relay
    tag: "0.1.27"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 47000
  publicAddress: ptt.example.com:47000
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 2
      memory: 256Mi

calls:
  enabled: false
  domain: calls.ptt.example.com
  turnDomain: turn.ptt.example.com
  signalingTlsSecretName: ptt-calls-tls
  turnTlsSecretName: ptt-turn-tls
  podDisruptionBudget:
    enabled: true
  # hostNetwork media ports must also be allowed by the node/cloud firewall.
  firewall:
    rtcTcpPort: 7881
    rtcUdpPort: 7882
    turnTlsPort: 5349
    turnUdpPort: 3478

# Official LiveKit chart 1.9.0 with its server image independently pinned to
# v1.13.6. Recording, ingress, egress, SIP and agents are not installed.
livekit:
  replicaCount: 1
  image:
    repository: livekit/livekit-server
    tag: v1.13.6
    pullPolicy: IfNotPresent
  terminationGracePeriodSeconds: 300
  podHostNetwork: true
  deploymentStrategy:
    type: Recreate
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: 4, memory: 2Gi }
  loadBalancer:
    type: disable
  turnLoadbalancer:
    enable: true
  storeKeysInSecret:
    enabled: true
    existingSecret: ptt-call-credentials
  livekit:
    port: 7880
    log_level: info
    key_file: /etc/livekit/keys.yaml
    prometheus_port: 6789
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: true
    redis:
      address: ptt-call-redis:6379
      # Must equal secrets.redisPassword. PTT Talk's vendored chart patch keeps
      # the complete LiveKit configuration in a Secret.
      password: ""
    webhook:
      api_key: ptt-call-v1
      urls:
        - http://ptt-call-webhook/v1/internal/livekit/webhook
    turn:
      enabled: true
      domain: turn.ptt.example.com
      secretName: ptt-turn-tls
      tls_port: 5349
      udp_port: 3478

ingress:
  enabled: true
  className: traefik
  host: ptt.example.com
  grpcHost: grpc.ptt.example.com
  tlsSecretName: ptt-tls
  annotations: {}
  grpcAnnotations:
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
  rateLimit:
    enabled: true
    average: 100
    burst: 200
    period: 1s

postgres:
  image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
  database: ptt
  username: ptt
  storage: 10Gi
  storageClassName: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }

redis:
  image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  storage: 1Gi
  storageClassName: local-path
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

objectStore:
  image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
  bucket: ptt-history
  storage: 20Gi
  storageClassName: local-path
  clientImage: minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1, memory: 512Mi }
  initResources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  from: "PTT Talk <ptt@example.com>"

push:
  fcm:
    enabled: false
  apns:
    enabled: false
    productionKeyId: ""
    sandboxKeyId: ""
    teamId: ""
    bundleId: "app.ptt.talk"

# Verified links are disabled until the operator supplies identifiers matching
# the exact mobile builds distributed for this instance.
verifiedLinks:
  enabled: false
  appleTeamId: ""
  appleBundleId: ""
  androidPackageName: ""
  androidCertSha256: []

backup:
  # Backups must never be written to an unencrypted local-path volume.
  enabled: false
  schedule: "17 2 * * *"
  storage: 20Gi
  storageClassName: ""
  encryptedStorageClassConfirmed: false
  finalizeImage: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
  retentionDays: 14
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }

secrets:
  databasePassword: ""
  redisPassword: ""
  objectStorePassword: ""
  bootstrapToken: ""
  smtpPassword: ""
  relaySharedSecret: ""
  metricsToken: ""
  fcmServiceAccountJson: ""
  apnsProductionPrivateKey: ""
  apnsSandboxPrivateKey: ""
  livekitApiKey: ptt-call-v1
  livekitApiSecret: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: true
