[workspace]
resolver = "2"
members = ["core", "control", "relay"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "pool", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.9"
redis = { version = "1.6", features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
