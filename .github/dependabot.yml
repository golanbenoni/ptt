version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      admin-web:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /cloudflare
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /qa/promptfoo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      promptfoo:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      native-rust:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-rust:
        patterns:
          - "*"
