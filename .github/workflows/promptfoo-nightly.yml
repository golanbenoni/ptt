name: promptfoo-nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-nightly
  cancel-in-progress: false

jobs:
  automated-host-campaign:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    timeout-minutes: 240
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/ptt-gradle-nightly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/promptfoo/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          command -v cmake
          command -v protoc
      - name: Check out pinned libsignal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: signalapp/libsignal
          ref: b056faa6dd02961cff24064c54c089c52e1a0753 # v0.101.0
          path: .test-deps/libsignal
          fetch-depth: 1
      - name: Build pinned libsignal for Swift product tests
        working-directory: .test-deps/libsignal
        run: cargo build -p libsignal-ffi --features "libsignal-bridge-testing log/release_max_level_info"
      - name: Build PTT Apple FFI for Swift product tests
        run: ./scripts/build-apple-native.sh
      - name: Install pinned application dependencies
        run: |
          npm ci --prefix admin-web --no-audit --prefer-offline
          npm ci --prefix cloudflare --no-audit --prefer-offline
      - name: Run Promptfoo automated campaign
        env:
          LIBSIGNAL_ROOT: ${{ github.workspace }}/.test-deps/libsignal
        run: ./scripts/run-promptfoo-suite.sh nightly
      - name: Run Promptfoo deterministic adversarial campaign
        run: ./scripts/run-promptfoo-suite.sh adversarial
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promptfoo-nightly-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
