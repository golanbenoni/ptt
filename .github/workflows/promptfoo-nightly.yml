name: promptfoo-nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-nightly
  cancel-in-progress: false

jobs:
  automated-host-campaign:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select JDK and native tools
        run: source ./scripts/java21-env.sh
      - name: Install pinned application dependencies
        run: |
          npm ci --prefix admin-web
          npm ci --prefix cloudflare
      - name: Run Promptfoo automated campaign
        run: ./scripts/run-promptfoo-suite.sh nightly
      - name: Run Promptfoo deterministic adversarial campaign
        run: ./scripts/run-promptfoo-suite.sh adversarial
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promptfoo-nightly-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
