name: encrypted-calls-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptt-encrypted-calls-release
  cancel-in-progress: false

env:
  ANDROID_HOME: /Users/golanbenoni/Library/Android/sdk
  ANDROID_SDK_ROOT: /Users/golanbenoni/Library/Android/sdk

jobs:
  focused-client-and-protocol:
    # This gate exercises Helm as well as the mobile clients. Keep it on the
    # runner that owns the pinned Docker/Helm toolchain instead of assuming
    # those tools exist on the signing-only build host.
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select pinned native tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          test "$(protoc --version)" = "libprotoc 25.3"
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: Verify call protocol, dependency, and Helm contracts
        run: |
          ./scripts/check-proto-contract.sh
          node ./scripts/verify-dependency-pins.mjs
          ./scripts/test-helm-calls.sh
          ./scripts/test-calls-deployment-validator.sh
          ./scripts/probe-livekit-cpu.sh --self-test
          ./scripts/test-livekit-e2ee-inspection.sh
          ./scripts/test-four-device-encrypted-calls-mapping.sh
      - name: Run focused Android encrypted-call tests and assembly
        run: |
          ./gradlew :talkandroid:testDebugUnitTest :talkandroid:assembleDebug --no-daemon
          ./scripts/verify-android-custom-permission.sh

  ios-simulator-e2ee:
    # The local iOS call proof needs Xcode and a local LiveKit container. The
    # container runner on SmallMac02 is the host that has both capabilities.
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    timeout-minutes: 75
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.test-deps/docker-${{ github.run_id }}-${{ github.run_attempt }}-calls-ios
      LIBSIGNAL_ROOT: ${{ github.workspace }}/.test-deps/libsignal
      LIBSIGNAL_SWIFT: ${{ github.workspace }}/.test-deps/libsignal/swift
      LIBSIGNAL_FFI: ${{ github.workspace }}/.test-deps/libsignal/target/aarch64-apple-ios-sim/debug
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out pinned libsignal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: signalapp/libsignal
          ref: b056faa6dd02961cff24064c54c089c52e1a0753 # v0.101.0
          path: .test-deps/libsignal
          submodules: recursive
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Select native tools and isolate Docker credentials
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          mkdir -p "$DOCKER_CONFIG"
          ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
      - name: Build shared Apple media and pinned libsignal
        run: |
          test "$(git -C "$LIBSIGNAL_ROOT" rev-parse HEAD)" = b056faa6dd02961cff24064c54c089c52e1a0753
          ./scripts/build-apple-native.sh
          ./scripts/build-libsignal-ios-sim.sh
      - name: Build a normally signed iOS Simulator app
        run: |
          test -f "$LIBSIGNAL_FFI/libsignal_ffi.a"
          xcodebuild -project ios/TalkApp/TalkApp.xcodeproj -scheme TalkApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/TalkApp/.derived \
            LIBRARY_SEARCH_PATHS="$LIBSIGNAL_FFI $GITHUB_WORKSPACE/native/target/aarch64-apple-ios-sim/release" \
            build
      - name: Prove iOS call key exchange, live epoch rotation, E2EE readiness, and teardown
        env:
          PTT_CALL_ACTIVE_HOOK: ${{ github.workspace }}/scripts/test-ios-simulator-call-epoch-rotation-hook.sh
          PTT_CALL_PROOF_DURATION_MS: "20000"
        run: ./scripts/test-ios-call-local-stack.sh
      - name: Remove isolated Docker configuration
        if: always()
        run: |
          case "$DOCKER_CONFIG" in
            "$GITHUB_WORKSPACE"/.test-deps/docker-*-calls-ios) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing to remove unexpected Docker config: $DOCKER_CONFIG" >&2 ;;
          esac
          case "$LIBSIGNAL_ROOT" in
            "$GITHUB_WORKSPACE"/.test-deps/libsignal) rm -rf -- "$LIBSIGNAL_ROOT" ;;
            *) echo "Refusing to remove unexpected libsignal checkout: $LIBSIGNAL_ROOT" >&2 ;;
          esac

  local-eight-party-load:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    timeout-minutes: 20
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.test-deps/docker-${{ github.run_id }}-${{ github.run_attempt }}-calls-load
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Isolate Docker credentials
        run: |
          mkdir -p "$DOCKER_CONFIG"
          ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
      - name: Require ten healthy eight-person rooms on pinned LiveKit
        env:
          PTT_LIVEKIT_LOAD_ROOMS: "10"
          PTT_LIVEKIT_LOAD_DURATION: 20s
        run: ./scripts/test-livekit-multiroom-load.sh
      - name: Remove isolated Docker configuration
        if: always()
        run: |
          case "$DOCKER_CONFIG" in
            "$GITHUB_WORKSPACE"/.test-deps/docker-*-calls-load) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing to remove unexpected Docker config: $DOCKER_CONFIG" >&2 ;;
          esac

  public-media-and-fallback:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    timeout-minutes: 30
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.test-deps/docker-${{ github.run_id }}-${{ github.run_attempt }}-calls-public
      PTT_E2E_SERVER: ${{ vars.PTT_E2E_SERVER }}
      PTT_CALLS_DOMAIN: ${{ vars.PTT_CALLS_DOMAIN }}
      PTT_TURN_DOMAIN: ${{ vars.PTT_TURN_DOMAIN }}
      PTT_LIVEKIT_LOAD_URL: ${{ vars.PTT_LIVEKIT_LOAD_URL }}
      PTT_LIVEKIT_METRICS_URL: ${{ vars.PTT_LIVEKIT_METRICS_URL }}
      PTT_LIVEKIT_MEDIA_CPU_CORES: ${{ vars.PTT_LIVEKIT_MEDIA_CPU_CORES }}
      PTT_TURN_USERNAME: ${{ secrets.PTT_TURN_USERNAME }}
      PTT_TURN_PASSWORD: ${{ secrets.PTT_TURN_PASSWORD }}
      PTT_LIVEKIT_LOAD_API_KEY: ${{ secrets.PTT_LIVEKIT_LOAD_API_KEY }}
      PTT_LIVEKIT_LOAD_API_SECRET: ${{ secrets.PTT_LIVEKIT_LOAD_API_SECRET }}
      PTT_LIVEKIT_METRICS_BEARER_TOKEN: ${{ secrets.PTT_LIVEKIT_METRICS_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require public media configuration
        run: |
          test -n "$PTT_E2E_SERVER"
          test -n "$PTT_CALLS_DOMAIN"
          test -n "$PTT_TURN_DOMAIN"
          test -n "$PTT_LIVEKIT_LOAD_URL"
          test -n "$PTT_LIVEKIT_METRICS_URL"
          test -n "$PTT_LIVEKIT_MEDIA_CPU_CORES"
          test -n "$PTT_TURN_USERNAME"
          test -n "$PTT_TURN_PASSWORD"
          test -n "$PTT_LIVEKIT_LOAD_API_KEY"
          test -n "$PTT_LIVEKIT_LOAD_API_SECRET"
          test -n "$PTT_LIVEKIT_METRICS_BEARER_TOKEN"
          case "$PTT_LIVEKIT_LOAD_URL" in
            wss://*) ;;
            *) echo "PTT_LIVEKIT_LOAD_URL must use wss://" >&2; exit 1 ;;
          esac
      - name: Select network probes and isolate Docker credentials
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          command -v turnutils_uclient >/dev/null || brew install coturn
          mkdir -p "$DOCKER_CONFIG"
          ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
      - name: Prove signaling, certificates, ICE/TCP, TURN/UDP, and TURN/TLS
        env:
          PTT_CALLS_REQUIRE_TURN_PROBE: "1"
        run: ./scripts/validate-calls-deployment.sh "$PTT_E2E_SERVER" "$PTT_CALLS_DOMAIN" "$PTT_TURN_DOMAIN"
      - name: Run the 256-participant shape against the public media node
        env:
          PTT_LIVEKIT_LOAD_ROOMS: "32"
          PTT_LIVEKIT_LOAD_DURATION: 20s
          PTT_LIVEKIT_LOAD_REQUIRE_CPU_PROBE: "1"
          PTT_LIVEKIT_LOAD_CPU_PROBE: ${{ github.workspace }}/scripts/probe-livekit-cpu.sh
          PTT_LIVEKIT_LOAD_MAX_CPU_PERCENT: "70"
        run: ./scripts/test-livekit-multiroom-load.sh
      - name: Remove isolated Docker configuration
        if: always()
        run: |
          case "$DOCKER_CONFIG" in
            "$GITHUB_WORKSPACE"/.test-deps/docker-*-calls-public) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing to remove unexpected Docker config: $DOCKER_CONFIG" >&2 ;;
          esac
