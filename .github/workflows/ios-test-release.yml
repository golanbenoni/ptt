name: ios-test-release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ios-test-release
  cancel-in-progress: false

jobs:
  signed-archive:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - name: Require tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-gates.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          test -x /opt/homebrew/bin/protoc
      - name: Verify private release configuration
        run: |
          test -f "$HOME/src/libsignal/target/aarch64-apple-ios/release/libsignal_ffi.a"
      - name: Install isolated CI signing assets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"

          signing_dir="$RUNNER_TEMP/ptt-signing-$GITHUB_RUN_ID"
          keychain="$signing_dir/ptt-ci.keychain-db"
          p12="$signing_dir/distribution.p12"
          downloaded_profile="$signing_dir/profile.mobileprovision"
          keychain_password="$(openssl rand -base64 36)"
          mkdir -p "$signing_dir" "$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | \
            openssl base64 -d -A -out "$p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | \
            openssl base64 -d -A -out "$downloaded_profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s \
            "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | \
            grep -q 'Apple Distribution'

          profile_plist="$signing_dir/profile.plist"
          security cms -D -i "$downloaded_profile" > "$profile_plist"
          profile_uuid="$(plutil -extract UUID raw "$profile_plist")"
          profile_name="$(plutil -extract Name raw "$profile_plist")"
          profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$downloaded_profile" "$profile_path"

          echo "PTT_CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "PTT_CI_PROFILE_PATH=$profile_path" >> "$GITHUB_ENV"
          echo "PTT_IOS_PROFILE=$profile_name" >> "$GITHUB_ENV"
      - name: Build and verify signed foreground TestFlight IPA
        env:
          LIBSIGNAL_ROOT: /Users/golanbenoni/src/libsignal
          PTT_IOS_FOREGROUND_FALLBACK: "1"
          PTT_IOS_AUTOMATIC_SIGNING: "0"
        run: ./scripts/ios-release.sh
      - name: Validate and upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: PR5J73RUQH
          APP_STORE_CONNECT_API_ISSUER_ID: 69a6de83-1d38-47e3-e053-5b8c7c11a4d1
        run: |
          ipa="$(find ios/TalkApp/build/release/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          test -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --validate-app --type ios --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Package signed release artifacts
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' \
            ios/TalkApp/TalkApp.xcodeproj/project.pbxproj | sort -u)
          version_code=$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION = ([^;]+);/\1/p' \
            ios/TalkApp/TalkApp.xcodeproj/project.pbxproj | sort -u)
          test -n "$version_name"
          test -n "$version_code"
          tar -C ios/TalkApp/build/release -czf \
            "$RUNNER_TEMP/ptt-talk-ios-$version_name-$version_code-$GITHUB_RUN_ID.xcarchive.tar.gz" PTT-Talk.xcarchive
      - name: Publish private handoff archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/publish-private-release-assets.sh \
            "$RUNNER_TEMP"/ptt-talk-ios-*-$GITHUB_RUN_ID.xcarchive.tar.gz \
            ios/TalkApp/build/release/export/*.ipa \
            ios/TalkApp/build/release/export/*.ipa.sha256
      - name: Remove isolated CI signing assets
        if: always()
        run: |
          if [[ -n "${PTT_CI_PROFILE_PATH:-}" ]]; then
            rm -f "$PTT_CI_PROFILE_PATH"
          fi
          if [[ -n "${PTT_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "$PTT_CI_KEYCHAIN" || true
          fi
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
