name: ios-test-release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ios-test-release
  cancel-in-progress: false

jobs:
  signed-archive:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - name: Require tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-gates.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          test -x /opt/homebrew/bin/protoc
      - name: Verify private release configuration
        run: |
          test -f "$HOME/src/libsignal/target/aarch64-apple-ios/release/libsignal_ffi.a"
      - name: Build unsigned foreground archive
        env:
          LIBSIGNAL_ROOT: /Users/golanbenoni/src/libsignal
        run: |
          export LIBSIGNAL_SWIFT="$LIBSIGNAL_ROOT/swift"
          export LIBSIGNAL_FFI="$LIBSIGNAL_ROOT/target/aarch64-apple-ios/release"
          ./scripts/build-apple-native.sh
          temporary="$RUNNER_TEMP/ptt-ios-unsigned"
          mkdir -p "$temporary"
          cp ios/TalkApp/Info.plist "$temporary/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :UIBackgroundModes:1' "$temporary/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :PTTUsesSystemFramework false' "$temporary/Info.plist"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>com.apple.developer.associated-domains</key><array><string>applinks:ptttalk.app</string></array></dict></plist>' \
            > "$temporary/TalkApp.entitlements"
          xcodebuild \
            -project ios/TalkApp/TalkApp.xcodeproj \
            -scheme TalkApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/TalkApp/build/release/PTT-Talk.xcarchive \
            "LIBRARY_SEARCH_PATHS=$LIBSIGNAL_FFI $GITHUB_WORKSPACE/native/target/aarch64-apple-ios/release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="$temporary/TalkApp.entitlements" \
            INFOPLIST_FILE="$temporary/Info.plist" \
            archive
          version_name=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' \
            ios/TalkApp/TalkApp.xcodeproj/project.pbxproj | sort -u)
          version_code=$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION = ([^;]+);/\1/p' \
            ios/TalkApp/TalkApp.xcodeproj/project.pbxproj | sort -u)
          test -n "$version_name"
          test -n "$version_code"
          tar -C ios/TalkApp/build/release -czf \
            "$RUNNER_TEMP/ptt-talk-ios-$version_name-$version_code-$GITHUB_RUN_ID.xcarchive.tar.gz" PTT-Talk.xcarchive
      - name: Publish private handoff archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/publish-private-release-assets.sh \
            "$RUNNER_TEMP"/ptt-talk-ios-*-$GITHUB_RUN_ID.xcarchive.tar.gz
