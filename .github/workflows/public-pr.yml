name: public-pull-request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install repository contract tools
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler ripgrep
      - name: Verify documentation and release metadata
        run: |
          node scripts/verify-documentation.mjs
          node scripts/verify-store-readiness.mjs
      - name: Verify protocol descriptor
        run: ./scripts/check-proto-contract.sh

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            cloudflare/package-lock.json
      - run: npm ci --prefix admin-web
      - run: npm run typecheck --prefix admin-web
      - run: npm run build --prefix admin-web
      - run: npm ci --prefix cloudflare
      - run: npm run typecheck --prefix cloudflare
      - run: npm --prefix cloudflare test -- --testTimeout=15000
      - run: npm run deploy:dry --prefix cloudflare

  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes cmake pkg-config protobuf-compiler
      - name: Check formatting
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo fmt --manifest-path server/Cargo.toml --all -- --check
      - name: Run Rust tests
        run: |
          cargo test --manifest-path native/Cargo.toml --locked
          cargo test --manifest-path server/Cargo.toml --locked
