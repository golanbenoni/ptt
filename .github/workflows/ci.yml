name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /Users/golanbenoni/Library/Android/sdk
  ANDROID_SDK_ROOT: /Users/golanbenoni/Library/Android/sdk

jobs:
  protocol:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - name: Select Homebrew tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/protoc
      - name: Verify frozen v1 descriptor
        run: ./scripts/check-proto-contract.sh

  jvm:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile all modules
        run: ./gradlew compileKotlin --no-daemon
      - name: JVM tests
        run: ./gradlew :crypto:test :floor:test :media:test :loopback:test :net:test --no-daemon
      - name: Two-process encrypted relay
        run: ./scripts/two-process.sh
      - name: Assemble Android device harness
        run: ./gradlew :crypto-persistence:lintDebug :talkandroid:lintDebug :talkandroid:assembleDebug --no-daemon

  swift-wire:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          test -x /opt/homebrew/bin/protoc
      - name: Swift wire tests
        working-directory: ios/PttWire
        run: swift test
      - name: Check out pinned libsignal
        uses: actions/checkout@v4
        with:
          repository: signalapp/libsignal
          ref: v0.101.0
          path: libsignal
          submodules: recursive
      - name: Build libsignal FFI
        working-directory: libsignal
        run: cargo build -p libsignal-ffi
      - name: Swift libsignal and audio fixture tests
        env:
          LIBSIGNAL_SWIFT: ${{ github.workspace }}/libsignal/swift
          LIBSIGNAL_FFI: ${{ github.workspace }}/libsignal/target/debug
        working-directory: ios/PttTalk
        run: swift test

  rust:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native workspace
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check && cargo test --manifest-path native/Cargo.toml --locked
      - name: Check server formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check
      - name: Check server workspace
        run: cargo test --manifest-path server/Cargo.toml --locked

  admin-web:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --prefix admin-web
      - run: npm run typecheck --prefix admin-web
      - run: npm run build --prefix admin-web

  containers:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    steps:
      - uses: actions/checkout@v4
      - name: Build control image
        run: docker build -f server/control/Dockerfile -t ptt-control:test .
      - name: Build relay image
        run: docker build -f server/relay/Dockerfile -t ptt-relay:test .
      - name: Build admin image
        run: docker build -f admin-web/Dockerfile -t ptt-admin-web:test .

  helm:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint self-hosted chart
        run: helm lint deploy/helm/ptt --set secrets.databasePassword=test-only --set secrets.redisPassword=test-only --set secrets.objectStorePassword=test-only --set secrets.sessionSigningKey=test-only-32-byte-session-key --set secrets.bootstrapToken=test-only-32-byte-bootstrap-token --set secrets.relaySharedSecret=test-only-32-byte-relay-shared-key
      - name: Render self-hosted chart
        run: helm template ptt deploy/helm/ptt --set secrets.databasePassword=test-only --set secrets.redisPassword=test-only --set secrets.objectStorePassword=test-only --set secrets.sessionSigningKey=test-only-32-byte-session-key --set secrets.bootstrapToken=test-only-32-byte-bootstrap-token --set secrets.relaySharedSecret=test-only-32-byte-relay-shared-key
