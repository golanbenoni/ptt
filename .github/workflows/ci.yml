name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /Users/golanbenoni/Library/Android/sdk
  ANDROID_SDK_ROOT: /Users/golanbenoni/Library/Android/sdk

jobs:
  protocol:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Homebrew tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/protoc
      - name: Verify frozen v1 descriptor
        run: ./scripts/check-proto-contract.sh
      - name: Verify current documentation and local links
        run: node ./scripts/verify-documentation.mjs
      - name: Verify synchronized store assets and disclosures
        run: node ./scripts/verify-store-readiness.mjs
      - name: Verify external acoustic burst analyzer
        run: python3 ./scripts/analyze-acoustic-tone.py --self-test
      - name: Verify bounded device command runner
        run: ./scripts/test-run-with-timeout.sh
      - name: Verify iOS console marker parser
        run: ./scripts/test-ios-console-marker.sh
      - name: Verify iOS physical-device lock parser
        run: ./scripts/test-ios-device-lock-parser.sh
      - name: Verify communication-establishment latency gate
        run: |
          ./scripts/assert-latency-samples.sh self-test '90,92,95,93,94,91,90,92,93,94,91,90,92,93,94,91,90,92,93,250' 20 95
          if ./scripts/assert-latency-samples.sh expected-failure '90,92,95,93,94,91,90,92,93,94,91,90,92,93,94,91,90,92,96,250' 20 95; then
            echo "Latency gate accepted an over-budget sample." >&2
            exit 1
          fi
      - name: Verify Firebase client configuration gate fixtures
        run: ./scripts/test-firebase-client-config.sh
      - name: Verify D1 backup restore gate fixture
        run: |
          ./scripts/verify-d1-backup-restore.sh tests/e2e/d1-backup-fixture.sql 0001_fixture.sql
          if ./scripts/verify-d1-backup-restore.sh tests/e2e/d1-backup-missing-table.sql 0001_fixture.sql; then
            echo "D1 restore gate accepted an incomplete backup." >&2
            exit 1
          fi

  jvm:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Install Android native build adapter
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: Compile all modules
        run: ./gradlew compileKotlin --no-daemon
      - name: JVM tests
        run: ./gradlew :crypto:test :floor:test :hardware:test :media:test :loopback:test :net:test :talkandroid:testDebugUnitTest --no-daemon
      - name: Two-process encrypted relay
        run: ./scripts/two-process.sh
      - name: Assemble Android device harness
        run: ./gradlew :crypto-persistence:lintDebug :talkandroid:lintDebug :talkandroid:assembleDebug --no-daemon
      - name: Audit Android accessibility in light, dark, and maximum text sizes
        env:
          PTT_REUSE_ANDROID_EMULATOR: "1"
        run: ./scripts/test-android-accessibility.sh
      - name: Capture Android interface review surfaces
        if: github.event_name == 'workflow_dispatch'
        env:
          PTT_ANDROID_STORE_OUTPUT: ${{ runner.temp }}/ptt-android-ui
          PTT_ANDROID_STORE_STOP_REUSED_EMULATOR: "1"
        run: ./scripts/capture-android-store-screenshots.sh
      - name: Upload Android interface review surfaces
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-interface-review
          path: ${{ runner.temp }}/ptt-android-ui/*.png
          if-no-files-found: error

  swift-wire:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          test -x /opt/homebrew/bin/protoc
      - name: Swift wire tests
        working-directory: ios/PttWire
        run: swift test
      - name: Cross-platform encrypted chat codec
        run: ./scripts/test-chat-codec-swift.sh
      - name: Check out pinned libsignal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signalapp/libsignal
          ref: b056faa6dd02961cff24064c54c089c52e1a0753 # v0.101.0
          path: libsignal
          submodules: recursive
      - name: Build libsignal FFI
        working-directory: libsignal
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build -p libsignal-ffi --features "libsignal-bridge-testing log/release_max_level_info"
      - name: Build shared Apple voice engine
        run: ./scripts/build-apple-native.sh
      - name: Swift libsignal and audio fixture tests
        env:
          LIBSIGNAL_SWIFT: ${{ github.workspace }}/libsignal/swift
          LIBSIGNAL_FFI: ${{ github.workspace }}/libsignal/target/debug
        working-directory: ios/PttTalk
        run: |
          test_keychain="$RUNNER_TEMP/ptt-swift-tests-${GITHUB_RUN_ID}.keychain-db"
          test_password="$(uuidgen)"
          previous_default="$(security default-keychain -d user | tr -d ' \"')"
          cleanup_keychain() {
            if [ -n "$previous_default" ]; then
              security default-keychain -d user -s "$previous_default" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$test_keychain" >/dev/null 2>&1 || true
          }
          trap cleanup_keychain EXIT
          security create-keychain -p "$test_password" "$test_keychain"
          security set-keychain-settings -lut 21600 "$test_keychain"
          security unlock-keychain -p "$test_password" "$test_keychain"
          security default-keychain -d user -s "$test_keychain"
          swift test
      - name: Build libsignal for iOS Simulator
        env:
          LIBSIGNAL_ROOT: ${{ github.workspace }}/libsignal
        run: ./scripts/build-libsignal-ios-sim.sh
      - name: Compile production iOS app
        env:
          LIBSIGNAL_SWIFT: ${{ github.workspace }}/libsignal/swift
          LIBSIGNAL_FFI: ${{ github.workspace }}/libsignal/target/aarch64-apple-ios-sim/debug
        run: |
          xcodebuild -project ios/TalkApp/TalkApp.xcodeproj -scheme TalkApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/TalkApp/.derived CODE_SIGNING_ALLOWED=NO \
            LIBRARY_SEARCH_PATHS="$GITHUB_WORKSPACE/libsignal/target/aarch64-apple-ios-sim/debug $GITHUB_WORKSPACE/native/target/aarch64-apple-ios-sim/release" \
            build
      - name: Probe iOS hold interaction and physical playback graph
        run: ./scripts/test-ios-simulator-app.sh ios/TalkApp/.derived/Build/Products/Debug-iphonesimulator/TalkApp.app
      - name: Audit iOS accessibility in light, dark, and maximum text sizes
        run: ./scripts/test-ios-accessibility.sh
      - name: Capture iOS interface review surfaces
        if: github.event_name == 'workflow_dispatch'
        env:
          PTT_IOS_STORE_OUTPUT: ${{ runner.temp }}/ptt-ios-ui
        run: ./scripts/capture-ios-store-screenshots.sh
      - name: Upload iOS interface review surfaces
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-interface-review
          path: ${{ runner.temp }}/ptt-ios-ui/*.png
          if-no-files-found: error

  rust:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check native workspace
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check && cargo test --manifest-path native/Cargo.toml --locked
      - name: Check server formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check
      - name: Check server workspace
        run: cargo test --manifest-path server/Cargo.toml --locked

  admin-web:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --prefix admin-web
      - run: npm run typecheck --prefix admin-web
      - run: npm run build --prefix admin-web

  cloudflare:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            cloudflare/package-lock.json
      - run: npm ci --prefix admin-web
      - run: npm run build --prefix admin-web
      - run: npm ci --prefix cloudflare
      - name: Verify production push readiness gate fixtures
        run: ./scripts/test-production-push-readiness.sh
      - run: npm run check --prefix cloudflare
      - name: Probe deployed two-device voice relay
        if: ${{ github.event_name == 'workflow_dispatch' && vars.PTT_E2E_SERVER != '' }}
        env:
          PTT_E2E_SERVER: ${{ vars.PTT_E2E_SERVER }}
          PTT_E2E_CHANNEL_ID: ${{ vars.PTT_E2E_CHANNEL_ID }}
          PTT_E2E_SENDER_TOKEN: ${{ secrets.PTT_E2E_SENDER_TOKEN }}
          PTT_E2E_RECEIVER_TOKEN: ${{ secrets.PTT_E2E_RECEIVER_TOKEN }}
        run: npm run test:deployed-media --prefix cloudflare

  containers:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    env:
      BUILDER_NAME: ptt-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_CONFIG: ${{ github.workspace }}/.test-deps/docker-${{ github.run_id }}-${{ github.run_attempt }}-containers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Docker from host credentials
        run: |
          mkdir -p "$DOCKER_CONFIG"
          ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
      - name: Create isolated builder
        run: docker buildx create --name "$BUILDER_NAME" --driver docker-container --use --bootstrap
      - name: Build control image
        run: docker buildx build --builder "$BUILDER_NAME" --load -f server/control/Dockerfile -t ptt-control:test .
      - name: Build relay image
        run: docker buildx build --builder "$BUILDER_NAME" --load -f server/relay/Dockerfile -t ptt-relay:test .
      - name: Build admin image
        run: docker buildx build --builder "$BUILDER_NAME" --load -f admin-web/Dockerfile -t ptt-admin-web:test .
      - name: Remove container build artifacts
        if: always()
        run: |
          docker image rm ptt-control:test ptt-relay:test ptt-admin-web:test 2>/dev/null || true
          if docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx rm --force "$BUILDER_NAME"
          fi
          docker run --rm --privileged --pid=host docker/desktop-reclaim-space >/dev/null
          docker image rm docker/desktop-reclaim-space:latest >/dev/null 2>&1 || true
          origin=$(git remote get-url origin)
          case "$origin" in
            https://github.com/golanbenoni/ptt|https://github.com/golanbenoni/ptt.git)
              git clean -ffdx
              ;;
            *)
              echo "Refusing to clean unexpected checkout: $origin" >&2
              exit 1
              ;;
          esac
          case "$DOCKER_CONFIG" in
            "$GITHUB_WORKSPACE"/.test-deps/docker-*-containers) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing to remove unexpected Docker config: $DOCKER_CONFIG" >&2 ;;
          esac

  control-integration:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.test-deps/docker-${{ github.run_id }}-${{ github.run_attempt }}-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Docker from host credentials
        run: mkdir -p "$DOCKER_CONFIG"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Fresh Postgres, Redis, and MinIO integration
        run: ./scripts/test-control-integration.sh
      - name: Remove isolated Docker configuration
        if: always()
        run: |
          case "$DOCKER_CONFIG" in
            "$GITHUB_WORKSPACE"/.test-deps/docker-*-control) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing to remove unexpected Docker config: $DOCKER_CONFIG" >&2 ;;
          esac

  helm:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Lint self-hosted chart
        run: helm lint deploy/helm/ptt --set secrets.databasePassword=test-only --set secrets.redisPassword=test-only --set secrets.objectStorePassword=test-only --set secrets.bootstrapToken=test-only-32-byte-bootstrap-token --set secrets.relaySharedSecret=test-only-32-byte-relay-shared-key --set secrets.metricsToken=test-only-32-byte-metrics-access-key
      - name: Render self-hosted chart
        run: helm template ptt deploy/helm/ptt --set secrets.databasePassword=test-only --set secrets.redisPassword=test-only --set secrets.objectStorePassword=test-only --set secrets.bootstrapToken=test-only-32-byte-bootstrap-token --set secrets.relaySharedSecret=test-only-32-byte-relay-shared-key --set secrets.metricsToken=test-only-32-byte-metrics-access-key
      - name: Reject reused APNs credentials
        run: ./scripts/test-helm-apns-separation.sh

  k3s-clean-install:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.test-deps/docker-${{ github.run_id }}-${{ github.run_attempt }}-k3s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Docker from host credentials
        run: mkdir -p "$DOCKER_CONFIG"
      - name: Select K3s test tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          command -v k3d >/dev/null || brew install k3d
      - name: Install the complete chart on disposable K3s
        run: ./scripts/test-k3s-clean-install.sh
      - name: Remove isolated Docker configuration
        if: always()
        run: |
          case "$DOCKER_CONFIG" in
            "$GITHUB_WORKSPACE"/.test-deps/docker-*-k3s) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing to remove unexpected Docker config: $DOCKER_CONFIG" >&2 ;;
          esac

  security:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select security scanners
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:$PATH"
          command -v trivy >/dev/null || brew install trivy
          command -v syft >/dev/null || brew install syft
      - name: Secret, dependency, and SBOM audit
        run: |
          ./scripts/test-security-audit-timeout.sh
          ./scripts/security-audit.sh
      - name: Upload audit artifacts
        # GitHub account-level artifact storage can be temporarily exhausted even
        # when the scanners themselves pass. Keep the security gate authoritative
        # while treating report retention as best-effort infrastructure.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-${{ github.sha }}
          path: build/security
          if-no-files-found: error
          retention-days: 30

  cleanup-build-host:
    if: always()
    needs: [protocol, jvm, swift-wire, rust, admin-web, cloudflare, helm, control-integration, security]
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - name: Remove PTT build outputs
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/.git" ]; then
            exit 0
          fi
          origin=$(git -C "$GITHUB_WORKSPACE" remote get-url origin)
          case "$origin" in
            https://github.com/golanbenoni/ptt|https://github.com/golanbenoni/ptt.git)
              git -C "$GITHUB_WORKSPACE" clean -ffdx
              ;;
            *)
              echo "Refusing to clean unexpected checkout: $origin" >&2
              exit 1
              ;;
          esac
