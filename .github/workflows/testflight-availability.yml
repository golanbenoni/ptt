name: testflight-availability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-availability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Check out the uploaded build contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Require processed build in internal TestFlight group
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          PTT_TESTFLIGHT_APP_ID: ${{ vars.PTT_TESTFLIGHT_APP_ID }}
          PTT_TESTFLIGHT_GROUP_ID: ${{ vars.PTT_TESTFLIGHT_GROUP_ID }}
          PTT_TESTFLIGHT_PROCESSING_ATTEMPTS: "240"
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' \
            ios/TalkApp/TalkApp.xcodeproj/project.pbxproj | sort -u)
          version_code=$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION = ([^;]+);/\1/p' \
            ios/TalkApp/TalkApp.xcodeproj/project.pbxproj | sort -u)
          test -n "$PTT_TESTFLIGHT_GROUP_ID"
          node scripts/app-store-connect-profile.mjs ensure-testflight \
            "$PTT_TESTFLIGHT_APP_ID" "$PTT_TESTFLIGHT_GROUP_ID" \
            "$version_name" "$version_code"
