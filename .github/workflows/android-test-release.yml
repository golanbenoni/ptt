name: android-test-release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: android-test-release
  cancel-in-progress: false

env:
  ANDROID_HOME: /Users/golanbenoni/Library/Android/sdk
  ANDROID_SDK_ROOT: /Users/golanbenoni/Library/Android/sdk

jobs:
  signed-bundle:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    steps:
      - uses: actions/checkout@v4
      - name: Require tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-gates.sh
      - name: Require production APNs and FCM readiness
        env:
          PTT_E2E_SERVER: ${{ vars.PTT_E2E_SERVER }}
        run: ./scripts/verify-production-push-readiness.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: Verify private release configuration
        run: |
          test -f "$HOME/.ptt_release/android.env"
          test -f "$HOME/.ptt_release/ptt-upload.jks"
      - name: Build and verify signed bundle
        run: |
          ./scripts/build-android-native.sh
          ./scripts/android-release.sh
      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.ptt.talk
          releaseFiles: android/talk/build/outputs/bundle/release/talkandroid-release.aab
          track: internal
          status: completed
      - name: Publish private handoff assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' android/talk/build.gradle.kts | head -1)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' android/talk/build.gradle.kts | head -1)
          test -n "$version_name"
          test -n "$version_code"
          cp android/talk/build/outputs/bundle/release/talkandroid-release.aab \
            "$RUNNER_TEMP/ptt-talk-android-$version_name-$version_code-$GITHUB_RUN_ID.aab"
          cp android/talk/build/outputs/bundle/release/talkandroid-release.aab.sha256 \
            "$RUNNER_TEMP/ptt-talk-android-$version_name-$version_code-$GITHUB_RUN_ID.aab.sha256"
          ./scripts/publish-private-release-assets.sh \
            "$RUNNER_TEMP/ptt-talk-android-$version_name-$version_code-$GITHUB_RUN_ID.aab" \
            "$RUNNER_TEMP/ptt-talk-android-$version_name-$version_code-$GITHUB_RUN_ID.aab.sha256"
