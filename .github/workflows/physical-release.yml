name: physical-release

on:
  workflow_dispatch:
    inputs:
      ios_device_1:
        description: CoreDevice identifier for the first unlocked Apple test device
        required: true
        type: string
      ios_device_2:
        description: CoreDevice identifier for the second unlocked Apple test device
        required: true
        type: string
      android_device_1:
        description: adb serial for the first authorized Android test device
        required: true
        type: string
      android_device_2:
        description: adb serial for the second authorized Android test device
        required: true
        type: string
      acoustic_input:
        description: AVFoundation audio input index for the isolated USB measurement microphone
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: physical-release-${{ github.sha }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /Users/golanbenoni/Library/Android/sdk
  ANDROID_SDK_ROOT: /Users/golanbenoni/Library/Android/sdk

jobs:
  four-device-parity:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Require software gates for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          PTT_SKIP_PHYSICAL_RELEASE_GATE: "1"
          PTT_SKIP_ANDROID_SOAK_GATE: "1"
        run: ./scripts/verify-release-gates.sh
      - name: Require production APNs and FCM readiness
        env:
          PTT_E2E_SERVER: ${{ vars.PTT_E2E_SERVER }}
        run: ./scripts/verify-production-push-readiness.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,aarch64-apple-ios
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android physical automation client
        env:
          PTT_FIREBASE_APPLICATION_ID: ${{ vars.PTT_FIREBASE_APPLICATION_ID }}
          PTT_FIREBASE_DEBUG_APPLICATION_ID: ${{ vars.PTT_FIREBASE_DEBUG_APPLICATION_ID }}
          PTT_FIREBASE_API_KEY: ${{ secrets.PTT_FIREBASE_API_KEY }}
          PTT_FIREBASE_PROJECT_ID: ${{ vars.PTT_FIREBASE_PROJECT_ID }}
          PTT_FIREBASE_SENDER_ID: ${{ vars.PTT_FIREBASE_SENDER_ID }}
        run: |
          test -n "$PTT_FIREBASE_APPLICATION_ID"
          test -n "$PTT_FIREBASE_DEBUG_APPLICATION_ID"
          test -n "$PTT_FIREBASE_API_KEY"
          test -n "$PTT_FIREBASE_PROJECT_ID"
          test -n "$PTT_FIREBASE_SENDER_ID"
          PTT_FIREBASE_APPLICATION_ID="$PTT_FIREBASE_DEBUG_APPLICATION_ID" \
            ./scripts/validate-firebase-client-config.sh
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/cmake
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          ./scripts/build-android-native.sh
          ./gradlew :talkandroid:assembleDebug --no-daemon
      - name: Build signed iOS physical automation client
        env:
          LIBSIGNAL_SWIFT: /Users/golanbenoni/src/libsignal/swift
          LIBSIGNAL_FFI: /Users/golanbenoni/src/libsignal/target/aarch64-apple-ios/release
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -f "$LIBSIGNAL_FFI/libsignal_ffi.a"
          ./scripts/build-apple-native.sh
          xcodebuild -project ios/TalkApp/TalkApp.xcodeproj -scheme TalkApp \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/TalkApp/.physical-derived \
            -allowProvisioningUpdates DEVELOPMENT_TEAM=M2M4752Z6K CODE_SIGN_STYLE=Automatic \
            LIBRARY_SEARCH_PATHS="$LIBSIGNAL_FFI $GITHUB_WORKSPACE/native/target/aarch64-apple-ios/release" \
            build
          app=ios/TalkApp/.physical-derived/Build/Products/Debug-iphoneos/TalkApp.app
          test -d "$app"
          signed_entitlements="$(codesign -d --entitlements :- "$app" 2>&1)"
          grep -q 'com.apple.developer.push-to-talk' <<<"$signed_entitlements"
          grep -q 'aps-environment' <<<"$signed_entitlements"
          grep -q 'development' <<<"$signed_entitlements"
      - name: Install dedicated debug clients on four devices
        env:
          PTT_IOS_DEVICE_1: ${{ inputs.ios_device_1 }}
          PTT_IOS_DEVICE_2: ${{ inputs.ios_device_2 }}
          PTT_ANDROID_DEVICE_1: ${{ inputs.android_device_1 }}
          PTT_ANDROID_DEVICE_2: ${{ inputs.android_device_2 }}
        run: |
          set -euo pipefail
          app=ios/TalkApp/.physical-derived/Build/Products/Debug-iphoneos/TalkApp.app
          apk=android/talk/build/outputs/apk/debug/talkandroid-debug.apk
          for device in "$PTT_IOS_DEVICE_1" "$PTT_IOS_DEVICE_2"; do
            xcrun devicectl device install app --device "$device" "$app"
          done
          for device in "$PTT_ANDROID_DEVICE_1" "$PTT_ANDROID_DEVICE_2"; do
            adb -s "$device" install -r -t "$apk"
            adb -s "$device" shell pm grant app.ptt.talk.debug android.permission.RECORD_AUDIO
            adb -s "$device" shell pm grant app.ptt.talk.debug android.permission.POST_NOTIFICATIONS || true
          done
      - name: Run same-platform, cross-platform, and external acoustic parity matrix
        env:
          PTT_IOS_DEVICE_1: ${{ inputs.ios_device_1 }}
          PTT_IOS_DEVICE_2: ${{ inputs.ios_device_2 }}
          PTT_ANDROID_DEVICE_1: ${{ inputs.android_device_1 }}
          PTT_ANDROID_DEVICE_2: ${{ inputs.android_device_2 }}
          PTT_E2E_SERVER: ${{ vars.PTT_E2E_SERVER }}
          PTT_E2E_ACI: ${{ secrets.PTT_E2E_ACI }}
          PTT_E2E_CHANNEL_ID: ${{ secrets.PTT_E2E_CHANNEL_ID }}
          PTT_E2E_SENDER_MAILBOX: ${{ secrets.PTT_E2E_SENDER_MAILBOX }}
          PTT_E2E_RECEIVER_MAILBOX: ${{ secrets.PTT_E2E_RECEIVER_MAILBOX }}
          PTT_E2E_SENDER_TOKEN: ${{ secrets.PTT_E2E_SENDER_TOKEN }}
          PTT_E2E_RECEIVER_TOKEN: ${{ secrets.PTT_E2E_RECEIVER_TOKEN }}
          PTT_E2E_SENDER_IDENTITY_FIXTURE: ${{ secrets.PTT_E2E_SENDER_IDENTITY_FIXTURE }}
          PTT_E2E_RECEIVER_IDENTITY_FIXTURE: ${{ secrets.PTT_E2E_RECEIVER_IDENTITY_FIXTURE }}
          PTT_E2E_TRANSMISSIONS: "5"
          PTT_E2E_MAX_FLOOR_LATENCY_MS: "150"
          PTT_E2E_MAX_READY_LATENCY_MS: "400"
          PTT_ACOUSTIC_INPUT: ${{ inputs.acoustic_input }}
          PTT_PHYSICAL_ANDROID_NETWORK_TRANSITION: "1"
          PTT_PHYSICAL_ANDROID_SCREEN_OFF: "1"
        run: ./scripts/record-physical-acoustic.sh ./scripts/test-four-device-parity.sh
      - name: Prove post-reboot rearm and system-channel restoration
        env:
          PTT_IOS_DEVICE_1: ${{ inputs.ios_device_1 }}
          PTT_IOS_DEVICE_2: ${{ inputs.ios_device_2 }}
          PTT_ANDROID_DEVICE_1: ${{ inputs.android_device_1 }}
          PTT_ANDROID_DEVICE_2: ${{ inputs.android_device_2 }}
        run: ./scripts/test-physical-reboot-restoration.sh
