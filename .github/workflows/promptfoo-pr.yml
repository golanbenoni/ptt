name: promptfoo-pr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-campaign:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/promptfoo/package-lock.json
      - name: Run Promptfoo pull-request campaign
        run: ./scripts/run-promptfoo-suite.sh pr
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptfoo-pr-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}/pr
          if-no-files-found: error
          retention-days: 30
