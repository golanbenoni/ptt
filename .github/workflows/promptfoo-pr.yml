name: promptfoo-pr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-campaign:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/promptfoo/package-lock.json
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Select native test tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/protoc
          test -x /opt/homebrew/bin/rg
      - name: Run Promptfoo pull-request campaign
        run: ./scripts/run-promptfoo-suite.sh pr
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptfoo-pr-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}/pr
          if-no-files-found: error
          retention-days: 30
