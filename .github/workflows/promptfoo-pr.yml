name: promptfoo-pr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-campaign:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run Promptfoo pull-request campaign
        run: ./scripts/run-promptfoo-suite.sh pr
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promptfoo-pr-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}/pr
          if-no-files-found: error
          retention-days: 30
