name: promptfoo-release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: promptfoo-release
  cancel-in-progress: false

jobs:
  exact-commit-release-evidence:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/promptfoo/package-lock.json
      - name: Aggregate exact-commit release proof with Promptfoo
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PTT_E2E_SERVER: ${{ vars.PTT_E2E_SERVER }}
        run: ./scripts/run-promptfoo-suite.sh release-aggregate
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promptfoo-release-aggregate-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}/release-aggregate
          if-no-files-found: error
          retention-days: 90
