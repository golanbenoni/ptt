name: promptfoo-release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: promptfoo-release
  cancel-in-progress: false

jobs:
  exact-commit-release-evidence:
    runs-on: [self-hosted, macOS, ARM64, ptt-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/promptfoo/package-lock.json
      - name: Aggregate exact-commit release proof with Promptfoo
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PTT_E2E_SERVER: ${{ vars.PTT_E2E_SERVER }}
        run: ./scripts/run-promptfoo-suite.sh release-aggregate
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptfoo-release-aggregate-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}/release-aggregate
          if-no-files-found: error
          retention-days: 90
