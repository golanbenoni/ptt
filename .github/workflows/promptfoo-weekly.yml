name: promptfoo-weekly

on:
  schedule:
    - cron: "29 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-weekly
  cancel-in-progress: false

jobs:
  infrastructure-interface-campaign:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/promptfoo/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Promptfoo weekly campaign
        run: ./scripts/run-promptfoo-suite.sh weekly
      - name: Run Promptfoo public browser campaign
        run: ./scripts/run-promptfoo-suite.sh browser
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promptfoo-weekly-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
