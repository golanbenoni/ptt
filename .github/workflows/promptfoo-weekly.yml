name: promptfoo-weekly

on:
  schedule:
    - cron: "29 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-weekly
  cancel-in-progress: false

env:
  ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
  ANDROID_SDK_ROOT: /opt/homebrew/share/android-commandlinetools

jobs:
  infrastructure-interface-campaign:
    runs-on: [self-hosted, macOS, ARM64, ptt-containers]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Select native build tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          command -v cmake
          command -v protoc
      - name: Check out pinned libsignal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: signalapp/libsignal
          ref: b056faa6dd02961cff24064c54c089c52e1a0753 # v0.101.0
          path: .test-deps/libsignal
          fetch-depth: 1
      - name: Build mobile accessibility clients
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.test-deps/gradle-weekly
          LIBSIGNAL_ROOT: ${{ github.workspace }}/.test-deps/libsignal
        run: |
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          ./scripts/build-android-native.sh
          ./gradlew :talkandroid:assembleDebug --no-daemon
          ./scripts/build-apple-native.sh
          ./scripts/build-libsignal-ios-sim.sh
      - name: Run Promptfoo weekly campaign
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.test-deps/gradle-weekly
          LIBSIGNAL_ROOT: ${{ github.workspace }}/.test-deps/libsignal
        run: ./scripts/run-promptfoo-suite.sh weekly
      - name: Run Promptfoo public browser campaign
        run: ./scripts/run-promptfoo-suite.sh browser
      - name: Retain redacted campaign evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promptfoo-weekly-${{ github.sha }}
          path: artifacts/promptfoo/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
