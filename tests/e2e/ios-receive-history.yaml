appId: app.ptt.talk
name: iOS encrypted receive history
---
- launchApp
- assertVisible: "Simulator Team"
- runFlow:
    when:
      visible: "Join simulator voice channel"
    commands:
      - tapOn: "Join simulator voice channel"
- assertVisible: "Voice channel joined"
- scrollUntilVisible:
    element: "Safety numbers"
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element: "History"
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element: "Refresh history"
    direction: DOWN
    visibilityPercentage: 100
- tapOn: "Refresh history"
- extendedWaitUntil:
    visible: "Encrypted teammate"
    timeout: 15000
