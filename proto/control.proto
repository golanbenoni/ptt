syntax = "proto3";
package ptt.control;
option java_package = "app.ptt.proto";
option java_multiple_files = true;

// PTT control protocol v1. Field numbers in this file are frozen. New fields
// must be optional/additive; removed fields stay reserved. Unknown messages
// are ignored and never interpreted as permission to transmit plaintext.

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_DEVICE_LIMIT = 4;
  ERROR_CODE_CHANNEL_FULL = 5;
  ERROR_CODE_FLOOR_BUSY = 6;
  ERROR_CODE_FLOOR_TIMEOUT = 7;
  ERROR_CODE_RATE_LIMITED = 8;
  ERROR_CODE_MEDIA_UNAVAILABLE = 9;
  ERROR_CODE_KEY_MATERIAL_MISSING = 10;
  ERROR_CODE_STALE_MEMBERSHIP_EPOCH = 11;
  ERROR_CODE_INTERNAL = 12;
}

enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_ACTIVE = 1;
  DEVICE_STATUS_PENDING = 2;
  DEVICE_STATUS_REVOKED = 3;
}

enum PresenceClass {
  PRESENCE_CLASS_UNSPECIFIED = 0;
  PRESENCE_CLASS_AVAILABLE = 1;
  PRESENCE_CLASS_BUSY = 2;
  PRESENCE_CLASS_SOLO = 3;
  PRESENCE_CLASS_STANDBY = 4;
  PRESENCE_CLASS_OFFLINE = 5;
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message DeviceAddress {
  bytes aci = 1;        // UUID, 16 bytes
  uint32 device_id = 2; // 1..2 in production voice v1
  bytes mailbox_id = 3; // opaque, 16 bytes
}

message ClientHello {
  ProtocolVersion version = 1;
  DeviceAddress device = 2;
  bytes access_token = 3;
  bytes push_token = 4;
  string push_provider = 5; // fcm|apns|apns-ptt
}

message ServerHello {
  ProtocolVersion version = 1;
  bytes connection_id = 2;
  bytes demux_token = 3; // 32 bytes; relay auth only, never a media key
  uint64 server_time_ms = 4;
}

message ApiError {
  ErrorCode code = 1;
  string safe_message = 2;
  uint32 retry_after_ms = 3;
}

message RecipientDevice {
  DeviceAddress address = 1;
  bytes envelope = 2; // DR/SSv2 ciphertext; server never parses the inner body
}

message DeviceEnvelopeBatch {
  bytes message_id = 1; // UUID, 16 bytes
  repeated RecipientDevice recipients = 2;
  uint64 expires_at_ms = 3;
}

message MembershipEpoch {
  bytes channel_id = 1;
  uint32 epoch = 2;
  bytes distribution_id = 3; // UUID, 16 bytes
  repeated DeviceAddress members = 4;
}

message HistoryMetadata {
  bytes talk_id = 1;
  bytes channel_id = 2;
  uint32 membership_epoch = 3;
  uint64 media_kid = 4;
  uint64 started_at_ms = 5;
  uint32 duration_ms = 6;
  uint64 expires_at_ms = 7;
  bytes object_id = 8; // opaque lookup key, not a storage URL
}

message PushRegistration {
  DeviceAddress device = 1;
  string provider = 2;
  bytes token = 3;
}

message TalkStart {
  FloorDecision decision = 1;
  MediaEpochAnnouncement epoch = 2;
}

message FloorDecision {
  bytes request_token = 1;
  bytes talk_id = 2;
  uint32 tot_ms = 3;
  uint64 media_epoch_kid = 4;
  uint32 sender_demux = 5;
}

message MediaEpochAnnouncement {
  bytes channel_id = 1;
  bytes talk_id = 2;
  uint32 epoch = 3;
  uint64 kid = 4;
  bytes sframe_base_key = 5;
  uint32 cipher_suite = 6;
  uint32 grace_ms = 7;
  uint32 sender_demux = 8;
  uint32 tot_ms = 9;
}

message FloorToken {
  bytes token = 1;
  uint32 sender_demux = 2;
  bytes channel_id = 3;
  uint32 priority_class = 4;
  uint32 requested_tot_ms = 5;
  uint32 membership_epoch = 6;
}

message FloorSerializerGrant {
  bytes token = 1;
  bytes channel_id = 2;
  uint32 sender_demux = 3;
  uint32 granted_tot_ms = 4;
}

message FloorSerializerDeny {
  bytes token = 1;
  bytes channel_id = 2;
  ErrorCode reason = 3;
  uint32 retry_after_ms = 4;
}

message FloorRelease {
  bytes token = 1;
  uint32 sender_demux = 2;
  bytes channel_id = 3;
}

message PresenceHeartbeat {
  DeviceAddress device = 1;
  PresenceClass presence = 2;
  uint64 sent_at_ms = 3;
}

message ClientFrame {
  oneof body {
    ClientHello hello = 1;
    DeviceEnvelopeBatch envelopes = 2;
    FloorToken floor_token = 3;
    FloorRelease floor_release = 4;
    PresenceHeartbeat presence = 5;
    PushRegistration push_registration = 6;
  }
}

message ServerFrame {
  oneof body {
    ServerHello hello = 1;
    RecipientDevice envelope = 2;
    FloorSerializerGrant floor_grant = 3;
    FloorSerializerDeny floor_deny = 4;
    ApiError error = 5;
  }
}

service ControlService {
  rpc Connect(stream ClientFrame) returns (stream ServerFrame);
}

message UploadPreKeysRequest {
  DeviceAddress device = 1;
  bytes identity_key = 2;
  bytes signed_prekey = 3;
  repeated bytes one_time_prekeys = 4;
  repeated bytes kyber_prekeys = 5;
}

message FetchPreKeysRequest {
  repeated DeviceAddress devices = 1; // maximum 128 device records
}

message PreKeyBundle {
  DeviceAddress device = 1;
  bytes identity_key = 2;
  bytes signed_prekey = 3;
  bytes one_time_prekey = 4;
  bytes kyber_prekey = 5;
}

message FetchPreKeysResponse {
  repeated PreKeyBundle bundles = 1;
}

message Empty {}

service PreKeyService {
  rpc Upload(UploadPreKeysRequest) returns (Empty);
  rpc FetchBatch(FetchPreKeysRequest) returns (FetchPreKeysResponse);
}
