[versions]
kotlin = "2.1.20"
agp = "8.9.1"
coroutines = "1.10.2"
junit = "5.12.2"
libsignal = "0.101.0"
# libsignal 0.101.0 is after the ~March 2025 Double Ratchet session-confusion
# fix (eprint 2026/727). Hashes from build-artifacts.signal.org, 2026-08-14.
libsignal-client-sha256 = "40c8edaa7e178a8b1610ac6c2c20f2f936c53791949468f77ea4b1af3a64a68f"
libsignal-android-sha256 = "7034a7ae986153c2261775f43be88edbe8d46cf364b4bc0df08a63fc9a1e389a"

[libraries]
libsignal-client = { module = "org.signal:libsignal-client", version.ref = "libsignal" }
libsignal-android = { module = "org.signal:libsignal-android", version.ref = "libsignal" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.12.2" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
