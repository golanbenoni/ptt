# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: PTT Talk exact-commit release evidence aggregation
prompts: ["{{lane}}"]
providers:
  - id: file://../providers/lane-provider.mjs
    label: ptt-native-gates
defaultTest:
  options: { disableVarExpansion: true }
  assert:
    - type: javascript
      value: file://../assertions/lane-passed.mjs
